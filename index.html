<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DutyShift</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Подключаем внешние стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div class="main-section">
        <div class="glass-panel header-controls">
            <div class="title-group">
                <h1><span>⚡</span> Расписание Дежурств</h1>
                <p id="current-period-label" style="color: var(--text-dim); font-size: 0.85rem;">Загрузка...</p>
            </div>

            <div class="nav-btns">
                <button class="nav-btn" id="auth-btn" onclick="handleAuthClick()">🔑 Вход</button>
                <button class="nav-btn" onclick="navigatePeriod(-1)">← Пред</button>
                <button class="nav-btn" onclick="goToday()">Сегодня</button>
                <button class="nav-btn" onclick="navigatePeriod(1)">След →</button>
            </div>
        </div>

        <div class="glass-panel" style="flex: 1;">
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </div>

    <div class="sidebar">
        <!-- Дашборд -->
        <div class="glass-panel">
            <div class="section-title" style="cursor: default;">📊 Аналитика</div>
            <div class="stats-grid" style="margin-top: 10px;">
                <div class="stat-card"><div class="stat-label">Дежурств / Месяц</div><div class="stat-value" id="stat-user-month">-</div></div>
                <div class="stat-card"><div class="stat-label">Дежурств / Год</div><div class="stat-value" id="stat-user-year">-</div></div>
                <div class="stat-card full-width"><div class="stat-label">Переработки (Фильтр / Месяц)</div><div class="stat-value" id="stat-user-overtime">-</div></div>
            </div>
        </div>

        <!-- Раздельный блок: Отпуска -->
        <div class="glass-panel collapsed" id="vacations-panel">
            <div class="section-title" onclick="toggleSection('vacations-panel', event)">
                <span>🌴 Отпуска <span class="toggle-arrow">▼</span></span>
                <div class="section-header-actions">
                    <button class="icon-btn admin-only" onclick="toggleForm('vacation-form', this, event)" title="Добавить отпуск">+</button>
                </div>
            </div>
            <div class="events-list" id="vacations-list"></div>
            <div class="add-form admin-only" id="vacation-form">
                <input type="text" id="vacation-name" placeholder="Сотрудник">
                <div style="display:flex; gap:4px;">
                    <input type="date" id="vacation-start" title="Начало">
                    <input type="date" id="vacation-end" title="Конец">
                </div>
                <button class="btn" onclick="addVacation()">Добавить отпуск</button>
            </div>
        </div>

        <!-- Раздельный блок: Дни Рождения -->
        <div class="glass-panel collapsed" id="bday-panel">
            <div class="section-title" onclick="toggleSection('bday-panel', event)">
                <span>🎂 Дни Рождения <span class="toggle-arrow">▼</span></span>
                <div class="section-header-actions">
                    <button class="icon-btn admin-only" onclick="toggleForm('bday-form', this, event)" title="Добавить день рождения">+</button>
                </div>
            </div>
            <div class="events-list" id="birthdays-list"></div>
            <div class="add-form admin-only" id="bday-form">
                <input type="text" id="bday-name" placeholder="ФИО / Имя">
                <div style="display:flex; gap:4px;">
                    <input type="text" id="bday-day" placeholder="День (1-31)" style="width: 50%;">
                    <select id="bday-month" style="width: 50%;"></select>
                </div>
                <button class="btn" onclick="addBirthday()">Добавить ДР</button>
            </div>
        </div>

        <!-- Управление Сотрудниками -->
        <div class="glass-panel">
            <div class="section-title" style="cursor: default;">👥 Сотрудники</div>
            <div class="staff-list" id="staff-list"></div>
            <div class="admin-only" style="display:flex; gap:6px; margin-top:10px;">
                <input type="text" id="new-staff-name" placeholder="Имя сотрудника">
                <button class="btn" onclick="addStaff()">+</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для смены -->
<div class="modal-overlay" id="shift-modal">
    <div class="modal">
        <h3 id="modal-date-title" style="color:#fff; font-size:1.1rem;">Редактирование</h3>
        <select id="modal-staff-select"></select>
        <div style="display:flex; gap:8px;">
            <button class="btn" style="flex:1;" onclick="saveModalShift()">Назначить</button>
            <button class="btn danger-btn" onclick="deleteModalShift()">Снять</button>
        </div>
        <button class="nav-btn" style="width:100%;" onclick="closeModal()">Отмена</button>
    </div>
</div>

<!-- Модальное окно авторизации -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal">
        <h3 style="font-size: 1.1rem; color: #fff;">Вход администратора</h3>
        <input type="password" id="auth-password-input" placeholder="Введите пароль..." onkeyup="if(event.key==='Enter') loginAdmin()">
        <div style="display: flex; gap: 8px; margin-top: 4px;">
            <button class="btn" style="flex: 1;" onclick="loginAdmin()">Войти</button>
            <button class="btn danger-btn" onclick="closeAuthModal()">Отмена</button>
        </div>
    </div>
</div>

<!-- Подключаем скрипт логики -->
<script src="app.js"></script>
</body>
</html>
